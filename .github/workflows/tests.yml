name: Run Tests

on:
  pull_request:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - "**/README.md"
      - "**/.github"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7.1.0

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          install-only: true
          version: v2.15.0

      - name: Run pre-commit hooks
        uses: hibare/.github/github/shared-workflows/pre-commit@v0.18.0
